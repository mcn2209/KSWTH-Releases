<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KSWTH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111d;color:#d7e6f2;font-family:sans-serif}
.wrap{max-width:620px;margin:auto;padding:20px 24px 36px;text-align:center}.title{font-size:34px;color:#69e0ff;margin:4px 0 6px}
.ci{width:104px;height:104px;object-fit:contain}.sub{color:#aac3d6;font-size:16px;margin:4px 0 8px}.live{display:inline-block;color:#43e0aa;border:1px solid #168e70;border-radius:12px;padding:3px 10px;font-size:11px;margin-bottom:14px}
input{width:100%;height:58px;background:#0c2336;color:white;border:1px solid #173f5c;padding:0 16px;font-size:16px}.tokenHelp{color:#6f8ba0;font-size:11px;text-align:left;margin:6px 2px 2px}
button{width:100%;height:62px;border:0;color:white;font-size:18px;font-weight:700;margin-top:12px}
.pc{background:#147eb4}.mobile{background:#007e70}.app{background:#5b32a0}.status{min-height:92px;padding:24px 8px 8px;color:#9bb5c8;white-space:pre-line}
.ok{color:#43e0aa}.fail{color:#ff7082}.version{color:#5b798f;font-size:12px;line-height:1.8;margin-top:10px}
.work{margin-top:24px;padding-top:18px;border-top:1px solid #173f5c;text-align:left}.work h2{font-size:18px;color:#69e0ff;margin:0 0 10px}
textarea{width:100%;min-height:110px;resize:vertical;background:#0c2336;color:white;border:1px solid #173f5c;padding:14px;font-size:15px}
.workButtons{display:flex;gap:8px}.workButtons button{height:52px;font-size:15px}.send{background:#147eb4}.attach{background:#42566a}.check{background:#007e70}
.responses{margin-top:14px}.response{background:#0b1d2d;border:1px solid #173f5c;border-radius:6px;padding:12px;margin-top:8px;white-space:pre-wrap;word-break:break-word}.response b{color:#43e0aa}
</style>
</head>
<body><main class="wrap">
<div class="title">KSWTH</div><img class="ci" src="ath_ci.png" alt="ATH CI"><div class="sub">ATH 원격 통합 MTS</div><div class="live">SIGNED UI LIVE</div>
<input id="token" type="password" placeholder="PC 런타임 갱신 전용 인증키">
<div class="tokenHelp">※ 인증키는 PC 런타임 갱신에만 사용됩니다.</div>
<button class="pc" onclick="pcRefresh()">PC 런타임 갱신</button>
<button class="mobile" onclick="mobileUiRefresh()">모바일 UI 갱신</button>
<button class="app" onclick="appUpdate()">네이티브 앱 갱신</button>
<div id="status" class="status">모바일 UI 갱신에는 인증키가 필요하지 않습니다.</div>
<section class="work"><h2>AI 작업 전송함</h2>
<textarea id="workText" placeholder="Codex에 전달할 작업 내용을 입력하세요."></textarea>
<div class="workButtons"><button class="send" onclick="sendWork()">텍스트 전송</button><button class="attach" onclick="attachWork()">파일·사진</button></div>
<button class="check" onclick="checkResponses()">새 답변 확인</button>
<div id="responses" class="responses"></div></section>
<div class="version">앱 <span id="appVer">-</span> · UI <span id="uiVer">-</span><br>서명 검증된 UI만 적용</div>
</main>
<script>
function token(){return document.getElementById('token').value.trim()}
function pcRefresh(){Kswth.pcRefresh(token())} function mobileUiRefresh(){window.kswthStatus('인증키 없이 모바일 UI 확인 중…',true);Kswth.mobileUiRefresh()} function appUpdate(){Kswth.appUpdate()}
function sendWork(){Kswth.saveAuthToken(token());Kswth.sendWork(document.getElementById('workText').value)}
function attachWork(){Kswth.saveAuthToken(token());Kswth.chooseWorkFile(document.getElementById('workText').value)}
function checkResponses(){Kswth.saveAuthToken(token());Kswth.checkWorkResponses()}
window.kswthWorkSent=function(){document.getElementById('workText').value=''}
window.kswthWorkResponse=function(taskId,text){const box=document.createElement('div');box.className='response';const title=document.createElement('b');title.textContent='답변 · '+taskId;box.appendChild(title);box.appendChild(document.createElement('br'));box.appendChild(document.createTextNode(text));document.getElementById('responses').prepend(box)}
window.kswthStatus=function(text,ok){const el=document.getElementById('status');el.textContent=text;el.className='status '+(ok?'ok':'fail')}
document.getElementById('appVer').textContent=Kswth.appVersion();document.getElementById('uiVer').textContent=Kswth.uiVersion();
if(Kswth.hasAuthToken())document.getElementById('token').placeholder='인증키 저장됨 (변경할 때만 입력)';
</script></body></html>
