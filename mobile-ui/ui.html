<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KSWTH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111d;color:#d7e6f2;font-family:sans-serif}
.wrap{max-width:620px;margin:auto;padding:20px 24px 36px;text-align:center}.title{font-size:34px;color:#69e0ff;margin:4px 0 6px}
.ci{width:104px;height:104px;object-fit:contain}.sub{color:#aac3d6;font-size:16px;margin:4px 0 18px}
input{width:100%;height:58px;background:#0c2336;color:white;border:1px solid #173f5c;padding:0 16px;font-size:16px}
button{width:100%;height:62px;border:0;color:white;font-size:18px;font-weight:700;margin-top:12px}
.pc{background:#147eb4}.mobile{background:#007e70}.app{background:#5b32a0}.status{min-height:92px;padding:24px 8px 8px;color:#9bb5c8;white-space:pre-line}
.ok{color:#43e0aa}.fail{color:#ff7082}.version{color:#5b798f;font-size:12px;line-height:1.8;margin-top:10px}
</style>
</head>
<body><main class="wrap">
<div class="title">KSWTH</div><img class="ci" src="ath_ci.png" alt="ATH CI"><div class="sub">ATH 원격 통합 앱</div>
<input id="token" type="password" placeholder="PC swath_runtime.json의 인증키">
<button class="pc" onclick="pcRefresh()">PC 런타임 갱신</button>
<button class="mobile" onclick="mobileUiRefresh()">모바일 UI 갱신</button>
<button class="app" onclick="appUpdate()">네이티브 앱 갱신</button>
<div id="status" class="status">인증키를 한 번 입력하면 안전하게 저장됩니다.</div>
<div class="version">앱 <span id="appVer">-</span> · UI <span id="uiVer">-</span><br>서명 검증된 UI만 적용</div>
</main>
<script>
function token(){return document.getElementById('token').value.trim()}
function pcRefresh(){Kswth.pcRefresh(token())} function mobileUiRefresh(){Kswth.mobileUiRefresh()} function appUpdate(){Kswth.appUpdate()}
window.kswthStatus=function(text,ok){const el=document.getElementById('status');el.textContent=text;el.className='status '+(ok?'ok':'fail')}
document.getElementById('appVer').textContent=Kswth.appVersion();document.getElementById('uiVer').textContent=Kswth.uiVersion();
if(Kswth.hasAuthToken())document.getElementById('token').placeholder='인증키 저장됨 (변경할 때만 입력)';
</script></body></html>
